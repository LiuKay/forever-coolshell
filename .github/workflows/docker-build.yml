name: Build Docker Image

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.20'
          
      - name: Build binary
        run: |
          CGO_ENABLED=0 GOOS=linux go build -o coolshell
          
      - name: Build Docker image
        run: docker build -t forever-coolshell:latest .
        
      - name: Export Docker image
        run: docker save forever-coolshell:latest > forever-coolshell.tar
        
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: forever-coolshell.tar
